services:
  docs-to-ai:
    build:
      context: .
      dockerfile: Dockerfile
      # Build-time configuration. Override any of these in a .env file or the
      # shell, e.g. CHUNKING_STRATEGY=semantic docker compose build
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
        EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
        EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
        USE_GPU_ACCELERATION_IF_AVAILABLE: ${USE_GPU_ACCELERATION_IF_AVAILABLE:-True}
        GPU_DEVICE_INDEX: ${GPU_DEVICE_INDEX:-0}
        USE_RERANKER: ${USE_RERANKER:-True}
        RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
        CHUNKING_STRATEGY: ${CHUNKING_STRATEGY:-semantic}
        CHUNK_SIZE: ${CHUNK_SIZE:-1024}
        CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
        CHUNK_BY_TOKEN: ${CHUNK_BY_TOKEN:-True}
        TOKENIZER_MODEL: ${TOKENIZER_MODEL:-cl100k_base}
        PRESERVE_HEADINGS: ${PRESERVE_HEADINGS:-True}
        MAX_HEADING_CHUNK_SIZE: ${MAX_HEADING_CHUNK_SIZE:-1024}
        MIN_CHUNK_SIZE: ${MIN_CHUNK_SIZE:-50}
        SEMANTIC_CHUNK_PERCENTILE: ${SEMANTIC_CHUNK_PERCENTILE:-95}
        SEMANTIC_CHUNK_MIN_SIZE: ${SEMANTIC_CHUNK_MIN_SIZE:-64}
        SEMANTIC_CHUNK_MAX_SIZE: ${SEMANTIC_CHUNK_MAX_SIZE:-1024}
        SEMANTIC_CHUNK_BUFFER_SIZE: ${SEMANTIC_CHUNK_BUFFER_SIZE:-1}
        DEFAULT_SEARCH_RESULTS: ${DEFAULT_SEARCH_RESULTS:-10}
        MAX_SEARCH_RESULTS: ${MAX_SEARCH_RESULTS:-20}
        RERANKER_TOP_N: ${RERANKER_TOP_N:-50}
        USE_BM25: ${USE_BM25:-True}
        BM25_WEIGHT: ${BM25_WEIGHT:-0.3}
        BM25_K1: ${BM25_K1:-1.5}
        BM25_B: ${BM25_B:-0.75}
        RRF_K: ${RRF_K:-60}
        CHROMA_SPACE: ${CHROMA_SPACE:-cosine}
        HNSW_EF_SEARCH: ${HNSW_EF_SEARCH:-200}
        HNSW_EF_CONSTRUCTION: ${HNSW_EF_CONSTRUCTION:-200}
        USE_FOLDER_AS_TOPIC: ${USE_FOLDER_AS_TOPIC:-True}
        DEFAULT_TOPIC: ${DEFAULT_TOPIC:-uncategorized}
        CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-my-documents}
        FULL_SCAN_ON_BOOT: ${FULL_SCAN_ON_BOOT:-False}
        FOLDER_WATCHER_ACTIVE_ON_BOOT: ${FOLDER_WATCHER_ACTIVE_ON_BOOT:-True}
        DEBOUNCE_SECONDS: ${DEBOUNCE_SECONDS:-10}
        FULL_SCAN_INTERVAL_DAYS: ${FULL_SCAN_INTERVAL_DAYS:-7}
    container_name: docs-to-ai
    image: mcp/docs-to-ai

    # Volumes for persistent data
    volumes:
      - ./cache/chromadb:/app/cache/chromadb # chromadb database (persists the vector store)
      - ./cache/doc_cache:/app/cache/doc_cache # Document cache (persists extracted text)
      - ./my-docs:/app/my-docs:ro  # Documents directory (your PDFs and Word docs)# Read-only to prevent accidental modifications

    # Environment variables (optional). These override the values baked into
    # the image at build time, so you can retune without rebuilding.
    environment:
      - PYTHONUNBUFFERED=1 # ensures that the python output i.e. the stdout and stderr streams are sent straight to terminal (e.g. your container log) without being first buffered
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1024}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-32}
      # - EMBEDDING_QUERY_PROMPT=...  # defaults to the model's built-in query prompt
      - USE_GPU_ACCELERATION_IF_AVAILABLE=${USE_GPU_ACCELERATION_IF_AVAILABLE:-True}
      - GPU_DEVICE_INDEX=${GPU_DEVICE_INDEX:-0}
      - CHUNKING_STRATEGY=${CHUNKING_STRATEGY:-semantic}
      - CHUNK_SIZE=${CHUNK_SIZE:-1024}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - CHUNK_BY_TOKEN=${CHUNK_BY_TOKEN:-True}
      - TOKENIZER_MODEL=${TOKENIZER_MODEL:-cl100k_base}
      - PRESERVE_HEADINGS=${PRESERVE_HEADINGS:-True}
      - MAX_HEADING_CHUNK_SIZE=${MAX_HEADING_CHUNK_SIZE:-1024}
      - MIN_CHUNK_SIZE=${MIN_CHUNK_SIZE:-50}
      - SEMANTIC_CHUNK_PERCENTILE=${SEMANTIC_CHUNK_PERCENTILE:-95}
      - SEMANTIC_CHUNK_MIN_SIZE=${SEMANTIC_CHUNK_MIN_SIZE:-64}
      - SEMANTIC_CHUNK_MAX_SIZE=${SEMANTIC_CHUNK_MAX_SIZE:-1024}
      - SEMANTIC_CHUNK_BUFFER_SIZE=${SEMANTIC_CHUNK_BUFFER_SIZE:-1}
      - USE_RERANKER=${USE_RERANKER:-True}
      - RERANKER_MODEL=${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - RERANKER_TOP_N=${RERANKER_TOP_N:-50}
      - USE_BM25=${USE_BM25:-True}
      - BM25_WEIGHT=${BM25_WEIGHT:-0.3}
      - BM25_K1=${BM25_K1:-1.5}
      - BM25_B=${BM25_B:-0.75}
      - RRF_K=${RRF_K:-60}
      - CHROMA_SPACE=${CHROMA_SPACE:-cosine}
      - HNSW_EF_SEARCH=${HNSW_EF_SEARCH:-200}
      - HNSW_EF_CONSTRUCTION=${HNSW_EF_CONSTRUCTION:-200}
      - DEFAULT_SEARCH_RESULTS=${DEFAULT_SEARCH_RESULTS:-10}
      - MAX_SEARCH_RESULTS=${MAX_SEARCH_RESULTS:-20}
      - USE_FOLDER_AS_TOPIC=${USE_FOLDER_AS_TOPIC:-True}
      - DEFAULT_TOPIC=${DEFAULT_TOPIC:-uncategorized}
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME:-my-documents}
      # Startup behavior control (defaults to True if not set)
      - FULL_SCAN_ON_BOOT=${FULL_SCAN_ON_BOOT:-False}
      - FOLDER_WATCHER_ACTIVE_ON_BOOT=${FOLDER_WATCHER_ACTIVE_ON_BOOT:-True}
      - DEBOUNCE_SECONDS=${DEBOUNCE_SECONDS:-10}
      - FULL_SCAN_INTERVAL_DAYS=${FULL_SCAN_INTERVAL_DAYS:-7}
      # # MCP server transport configuration
      # - MCP_TRANSPORT=${MCP_TRANSPORT:-stdio}
      # - MCP_HOST=${MCP_HOST:-0.0.0.0}
      # - MCP_PORT=${MCP_PORT:-38777}
        
    # Stdin/stdout for MCP protocol (needed for stdio mode)
    stdin_open: true
    tty: false

    # # # Port mapping for websocket/SSE mode
    ports:
      - "${MCP_PORT:-38777}:38777"

    # Restart policy
    restart: unless-stopped
    
    # GPU passthrough (optional). Uncomment to expose NVIDIA GPUs to the
    # container; requires the NVIDIA driver + NVIDIA Container Toolkit on the
    # host, and a CUDA-enabled torch build (the PyPI Linux wheel is CUDA-enabled).
    # Remove this block on hosts without a GPU, otherwise `docker compose up`
    # fails while reserving the device.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all          # or `device_ids: ['0']` to pin a GPU
    #           capabilities: [gpu]

    # Resource limits (optional - adjust based on your needs)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G
    #     reservations:
    #       cpus: '1'
    #       memory: 2G

    
    # Command can be overridden
    # command: python mcp_server.py
